name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Load the signing key (if set up)
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          if [ -n "$ANDROID_SIGNING" ]; then
            PASS="${ANDROID_SIGNING%%:*}"
            echo "::add-mask::$PASS"
            printf '%s' "${ANDROID_SIGNING#*:}" | base64 -d > "$RUNNER_TEMP/foodlee.keystore"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/foodlee.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
              echo "ANDROID_KEY_PASSWORD=$PASS"
              echo "ANDROID_KEY_ALIAS=foodlee"
            } >> "$GITHUB_ENV"
            echo "Signing with the Foodlee key."
          else
            echo "No ANDROID_SIGNING secret yet: using a temporary test key."
          fi
      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk foodlee.apk
      - name: Publish it as the latest app release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Foodlee app ${{ github.run_number }}
          body: "Android app for www.foodlee.in. Download foodlee.apk below and open it on your phone to install."
          files: foodlee.apk
          make_latest: true
